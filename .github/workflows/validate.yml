name: Validate and Release Plugin

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate package layout and Python sources
        run: python .infernux-dev/validate.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify a reproducible package
        run: |
          mkdir -p dist/repro
          python package.py build dist/plugin.inxpkg
          python package.py verify dist/plugin.inxpkg
          python package.py build dist/repro/plugin.inxpkg
          cmp dist/plugin.inxpkg dist/repro/plugin.inxpkg
          rm -rf dist/repro
      - name: Generate the Infernux release manifest
        run: >-
          python package.py release-manifest dist/plugin.inxpkg
          --tag "${GITHUB_REF_NAME}"
          --output dist/infernux-plugin-release.json
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/plugin.inxpkg
          dist/infernux-plugin-release.json
          --verify-tag
          --generate-notes
